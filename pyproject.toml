[project]
name = "mushroom-mca"
version = "1.0.0"
description = "What does a multiple correspondence analysis keep and lose on a near-separable categorical dataset? An honestly cross-validated study on UCI Mushroom."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pierre Chambet", email = "pierrechambet@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
]

[project.scripts]
mushroom = "mushroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mushroom"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "prince>=0.21.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
